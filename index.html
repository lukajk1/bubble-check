<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bubble Check</title>
  <meta name="description" content="How well do you know what Americans actually believe, buy, watch and do? A 10-minute quiz built on recent survey data.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span>Bubble Check</div>
    <button id="reset" class="ghost small" type="button">Reset quiz</button>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="foot">
    Questions use U.S. survey and market data from 2023 onward. Sources are listed with your results.
  </footer>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
